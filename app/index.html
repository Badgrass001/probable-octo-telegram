<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flâneur · Paris 16e</title>
  <meta name="description" content="Chaque rue a une histoire. Flâneur vous raconte les voies du 16e arrondissement de Paris au fil de vos pas : origine du nom, histoire, bâtiments remarquables, personnalités, cinéma, littérature…">
  <meta name="theme-color" content="#1c3366">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Flâneur, accueil">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <span class="brand-text">
          <strong>Flâneur</strong>
          <small>Paris 16<sup>e</sup><span class="brand-tag"> · chaque rue a une histoire</span></small>
        </span>
      </a>
      <nav class="top-actions" aria-label="Actions">
        <button class="icon-btn" id="btn-search" title="Chercher une voie" aria-label="Chercher une voie">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
        </button>
        <button class="icon-btn" id="btn-parcours" title="Parcours thématiques" aria-label="Parcours thématiques">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.8"/></svg>
        </button>
        <button class="icon-btn" id="btn-voice" title="Guide vocal" aria-label="Activer le guide vocal" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button class="icon-btn" id="btn-carnet" title="Mon carnet de flânerie" aria-label="Mon carnet de flânerie">
          <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>
          <span class="badge" id="carnet-count" hidden>0</span>
        </button>
      </nav>
    </header>

    <main class="layout">
      <section class="map-wrap" aria-label="Carte">
        <div id="map"></div>
        <div class="gps-pill" id="gps-pill" role="status"><span class="dot"></span><span class="txt">Géolocalisation inactive</span></div>
        <div class="map-ctrls" role="group" aria-label="Options de la carte">
          <button class="map-ctrl" id="btn-places" aria-pressed="true" title="Lieux remarquables" aria-label="Afficher les lieux remarquables">
            <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-5h6v5"/></svg>
          </button>
          <button class="map-ctrl" id="btn-compass" aria-pressed="false" title="Orienter la carte selon ma direction" aria-label="Boussole : orienter la carte selon ma direction">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><g class="needle"><path class="n" d="M12 4.5 14.6 12H9.4z"/><path class="s" d="M12 19.5 9.4 12h5.2z"/></g></svg>
          </button>
          <button class="map-ctrl" id="btn-full" aria-pressed="false" title="Carte en plein écran" aria-label="Carte en plein écran">
            <svg viewBox="0 0 24 24"><path class="open" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="close" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
          </button>
        </div>
        <div class="route-bar" id="route-bar" hidden>
          <button class="route-bar-txt"></button>
          <button class="route-bar-x" id="route-bar-close" aria-label="Quitter le parcours"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="street-bar" id="street-bar" hidden>
          <span class="sb-plaque"><span class="sb-name"></span></span>
          <button class="btn primary" id="sb-read">Lire la fiche</button>
        </div>
        <div class="map-attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> · <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a></div>
        <button class="fab" id="btn-locate" aria-label="Me localiser et suivre ma promenade" title="Me localiser">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
        </button>
        <p class="map-hint" id="map-hint">Touchez la carte pour découvrir une rue</p>
      </section>

      <aside class="panel" id="panel" aria-live="polite">
        <button class="grabber" id="grabber" aria-label="Agrandir le panneau"><span></span></button>
        <div class="panel-scroll" id="panel-scroll">
          <div id="panel-content"></div>
        </div>
      </aside>
    </main>

    <!-- Recherche -->
    <div class="overlay" id="search-overlay" hidden>
      <div class="overlay-card search-card" role="dialog" aria-modal="true" aria-labelledby="search-title">
        <div class="overlay-head">
          <h2 id="search-title">Chercher une voie</h2>
          <button class="icon-btn close" data-close aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <label class="search-field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="search-input" type="search" placeholder="Rue, avenue, villa, hameau…" autocomplete="off" spellcheck="false">
        </label>
        <div class="search-meta" id="search-meta"></div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <!-- Carnet -->
    <div class="overlay" id="carnet-overlay" hidden>
      <div class="overlay-card carnet-card" role="dialog" aria-modal="true" aria-labelledby="carnet-title">
        <div class="overlay-head">
          <h2 id="carnet-title">Mon carnet de flânerie</h2>
          <button class="icon-btn close" data-close aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="carnet-content"></div>
      </div>
    </div>

    <!-- Aperçu d'un lien -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
      <button class="grabber" data-close aria-label="Fermer"><span></span></button>
      <div id="sheet-content"></div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
