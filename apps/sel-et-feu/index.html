<title>Sel &amp; Feu</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une colonne façon app mobile (480px max), en-tête collant, barre d'onglets fixe en bas. */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --sunk: #E6ECE8;
  --ink: #18201C;
  --muted: #5A6862;
  --line: #D6DED9;
  --accent: #1E6E47;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE4;
  --sel: #3F679E;
  --acide: #8A7A00;
  --gras: #9A5F0C;
  --chaleur: #B83A0A;
  --monde: #6B4FA0;
  --tech: #2F6F78;
  --good: #1E7A44;
  --bad: #B3261E;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1A211E; --sunk: #222B27; --ink: #E6EDE9; --muted: #98A69F; --line: #2C3632;
    --accent: #52C48B; --accent-ink: #0C1A13; --accent-soft: #1D3328;
    --sel: #86A9DD; --acide: #D9C83C; --gras: #E0A24A; --chaleur: #F07A4A; --monde: #B39AE6; --tech: #6CC0CA;
    --good: #5CCB8A; --bad: #F2867E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A211E; --sunk: #222B27; --ink: #E6EDE9; --muted: #98A69F; --line: #2C3632;
  --accent: #52C48B; --accent-ink: #0C1A13; --accent-soft: #1D3328;
  --sel: #86A9DD; --acide: #D9C83C; --gras: #E0A24A; --chaleur: #F07A4A; --monde: #B39AE6; --tech: #6CC0CA;
  --good: #5CCB8A; --bad: #F2867E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}

/* En-tête */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; align-items: center; gap: 10px;
  padding-block: 14px 10px;
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.01em; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: .85rem;
  font-variant-numeric: tabular-nums;
}
.chip svg { width: 16px; height: 16px; }
.back { background: none; border: 0; padding: 6px; margin-left: -6px; display: inline-flex; border-radius: 10px; }
.back svg { width: 24px; height: 24px; }

/* Accueil */
.hello { display: grid; gap: 4px; padding-block: 8px 18px; }
.hello h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
.hello p { margin: 0; color: var(--muted); }

.next {
  display: grid; gap: 12px; padding: 18px; border-radius: var(--radius);
  background: var(--accent); color: var(--accent-ink); border: 0; text-align: left; width: 100%;
}
.next .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; opacity: .85; }
.next h2 { font-size: 1.35rem; font-weight: 800; }
.next .go { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: .9rem; }

.section { display: grid; gap: 10px; padding-block: 22px 0; }
.section > h3 { font-family: var(--font-body); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.track {
  display: grid; gap: 10px; align-content: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
}
.track:hover { border-color: var(--c); }
.glyph {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c);
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem;
}
.track .name { font-weight: 700; font-size: 1.02rem; }
.track .meta { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: inherit; transition: width .4s ease; }

.list { display: grid; gap: 8px; }
.row {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; width: 100%;
}
.row:hover { border-color: var(--c, var(--accent)); }
.row .txt { min-width: 0; display: grid; gap: 2px; }
.row .name { font-weight: 700; }
.row .meta { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.row .end { color: var(--muted); }
.row .end svg { width: 20px; height: 20px; display: block; }

/* Piste */
.track-head { display: grid; gap: 10px; padding-block: 6px 18px; }
.track-head h1 { font-size: 1.8rem; font-weight: 800; }
.track-head p { margin: 0; color: var(--muted); }
.lesson-row .num {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
  border: 2px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums;
}
.lesson-row.done .num { background: var(--c); border-color: var(--c); color: var(--surface); }
.lesson-row.done .num svg { width: 20px; height: 20px; }

/* Leçon */
.lesson { display: grid; gap: 18px; padding-block: 4px 0; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 99px; background: var(--sunk); }
.steps i.on { background: var(--c); }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px 20px; display: grid; gap: 12px; min-height: 260px; align-content: start;
}
.card .kicker { color: var(--c); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.card h2 { font-size: 1.45rem; font-weight: 800; }
.card p { margin: 0; font-size: 1.05rem; }
.card .tip { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: .95rem; color: var(--ink); }
.card .tip b { color: var(--c); }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; padding: 13px 14px; border-radius: 12px; background: var(--bg);
  border: 2px solid var(--line); font-weight: 600;
}
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.opt:disabled { cursor: default; }
.feedback { font-size: .95rem; border-radius: 10px; padding: 10px 12px; }
.feedback.ok { background: color-mix(in srgb, var(--good) 14%, transparent); }
.feedback.ko { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.feedback strong { display: block; }

.cta {
  width: 100%; padding: 15px; border-radius: 14px; border: 0; font-weight: 700; font-size: 1.02rem;
  background: var(--accent); color: var(--accent-ink);
}
.cta:disabled { background: var(--sunk); color: var(--muted); cursor: default; }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

.done-screen { text-align: center; display: grid; gap: 14px; justify-items: center; padding-block: 30px; }
.done-screen .medal {
  width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c);
}
.done-screen .medal svg { width: 48px; height: 48px; }
.done-screen h1 { font-size: 1.8rem; font-weight: 800; }
.done-screen p { margin: 0; color: var(--muted); max-width: 32ch; }
.done-screen .xp { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--accent); }
.actions { display: grid; gap: 10px; width: 100%; }

/* Réparer un plat */
.fix-intro { display: grid; gap: 6px; padding-block: 8px 16px; }
.fix-intro h1 { font-size: 1.8rem; font-weight: 800; }
.fix-intro p { margin: 0; color: var(--muted); }
.problems { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.problem {
  text-align: left; display: grid; gap: 4px; padding: 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
}
.problem:hover { border-color: var(--c); }
.problem .tag { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
.problem .name { font-weight: 700; line-height: 1.25; }
.fix { display: grid; gap: 14px; }
.fix h1 { font-size: 1.7rem; font-weight: 800; }
.fix .symptom { color: var(--muted); margin: 0; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; }
.block h3 { font-family: var(--font-body); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
.block p { margin: 0; }
.block ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.block.primary { border-color: var(--c); border-width: 2px; }

/* Profil */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .8rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: grid; gap: 6px; justify-items: center; font-size: .75rem; color: var(--muted); }
.day i { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--sunk); display: block; }
.day.on i { background: var(--accent); }
.confirm { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--bad); border-radius: var(--radius); padding: 14px; }
.confirm p { margin: 0; }
.confirm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.danger { background: var(--bad); color: var(--surface); }
.note { color: var(--muted); font-size: .85rem; margin: 0; }

/* Barre d'onglets */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 3px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

.view { animation: rise .25s ease both; }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } .bar > i { transition: none; } }
@media (max-width: 360px) { .problems, .pillars { grid-template-columns: 1fr; } }
</style>

<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div class="tabs"><nav id="tabs" aria-label="Navigation principale"></nav></div>

<script>
// ---------- Icônes ----------
const I = {
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg>',
  wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21l7-7"/><path d="M14.5 3.5a4.5 4.5 0 0 0-1.8 5.9L11 11l2 2 1.6-1.7a4.5 4.5 0 0 0 5.9-1.8l-2.8-.6-.6-2.8z"/><path d="M8 4l2 2-1 3-3 1-2-2"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  pan: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><ellipse cx="13" cy="18" rx="10" ry="6" /><path d="M23 17l7-3"/><path d="M10 9c0-2 2-2 2-4M15 9c0-2 2-2 2-4" /></svg>'
};

// ---------- Contenu ----------
// Étape : { k:"card", h, p, tip } ou { k:"quiz", q, o:[...], a: index, why }
const TRACKS = [
  { id:"sel", group:"Les quatre piliers", name:"Le sel", glyph:"S", color:"--sel", desc:"Le sel fait ressortir les saveurs. Tout le reste en dépend.", lessons:[
    { title:"Pourquoi saler ?", steps:[
      { k:"card", h:"Le sel n’ajoute pas qu’un goût salé", p:"Bien dosé, il atténue l’amertume et fait ressortir les arômes déjà présents. Une tomate salée a plus le goût de tomate.", tip:"<b>Test :</b> goûtez une rondelle de concombre nature, puis avec trois grains de sel." },
      { k:"card", h:"Salez tôt, par petites touches", p:"Le sel met du temps à pénétrer les aliments. Salé en début de cuisson, un plat est assaisonné à cœur. Salé à la fin, il reste fade dedans et salé dessus." },
      { k:"quiz", q:"Quel est l’effet d’un peu de sel sur l’amertume ?", o:["Il l’accentue","Il l’atténue","Il n’a aucun effet"], a:1, why:"Le sel bloque en partie la perception de l’amertume. C’est pour ça qu’on sale le pamplemousse ou les endives." }
    ]},
    { title:"Saler l’eau de cuisson", steps:[
      { k:"card", h:"10 g par litre", p:"Pour les pâtes et les légumes, comptez environ 10 g de sel par litre d’eau, soit une cuillère à soupe rase. L’eau doit avoir le goût d’un bouillon bien assaisonné.", tip:"<b>Repère :</b> pour 500 g de pâtes, 5 L d’eau et 50 g de sel." },
      { k:"card", h:"Saler au bon moment", p:"Salez l’eau quand elle bout. Le sel ne la fait pas bouillir plus vite de façon perceptible, mais une eau salée froide peut piquer le fond des casseroles en inox." },
      { k:"quiz", q:"Combien de sel pour 3 L d’eau de cuisson des pâtes ?", o:["3 g","30 g","150 g"], a:1, why:"10 g par litre, donc 30 g. À 3 g, les pâtes restent fades ; à 150 g, elles sont immangeables." }
    ]},
    { title:"Saler la viande à l’avance", steps:[
      { k:"card", h:"Le sel a besoin de temps", p:"Sur une viande, le sel attire d’abord l’humidité vers la surface. Après environ 40 minutes, ce jus salé est réabsorbé et assaisonne la chair en profondeur." },
      { k:"card", h:"La zone à éviter", p:"Entre 3 et 40 minutes après salage, la surface est humide. La viande colore mal et bout dans la poêle. Salez juste avant la cuisson, ou au moins 40 minutes avant.", tip:"<b>Idéal :</b> salez un poulet entier la veille et laissez-le à découvert au réfrigérateur." },
      { k:"quiz", q:"Vous allez saisir un steak. Quand le saler ?", o:["15 minutes avant","Juste avant ou au moins 40 minutes avant","Seulement après la cuisson"], a:1, why:"À 15 minutes, la surface est mouillée et la croûte se forme mal." }
    ]}
  ]},
  { id:"acide", group:"Les quatre piliers", name:"L’acide", glyph:"A", color:"--acide", desc:"L’acidité équilibre, allège et réveille un plat lourd.", lessons:[
    { title:"L’acide réveille un plat", steps:[
      { k:"card", h:"Le manque d’acide passe pour un manque de sel", p:"Un plat qui paraît plat ou lourd alors qu’il est assez salé manque souvent d’acidité. Citron, vinaigre, tomate, yaourt, vin : tous apportent du relief." },
      { k:"card", h:"Goûtez, ajustez, regoûtez", p:"Ajoutez l’acide par gouttes, puis goûtez. Le bon dosage se reconnaît : le plat paraît plus vif, sans goût de citron marqué.", tip:"<b>Astuce :</b> gardez un demi-citron près des plaques pendant la cuisson." },
      { k:"quiz", q:"Votre sauce crémée est assez salée mais paraît terne et lourde. Que faire ?", o:["Ajouter du sel","Ajouter quelques gouttes de citron","Ajouter du beurre"], a:1, why:"L’acide coupe la richesse du gras et fait ressortir les arômes. Le sel n’y changera rien." }
    ]},
    { title:"L’acide au bon moment", steps:[
      { k:"card", h:"En fin de cuisson, il reste vif", p:"Un trait de vinaigre ajouté à la fin garde tout son mordant. Ajouté au début, il s’adoucit et se fond dans le plat. Choisissez selon l’effet voulu." },
      { k:"card", h:"L’acide ralentit la cuisson", p:"En milieu acide, les légumineuses et certains légumes ramollissent beaucoup plus lentement. Des haricots secs cuits avec de la tomate peuvent rester durs pendant des heures.", tip:"<b>Règle :</b> cuisez les haricots à l’eau, puis ajoutez la tomate." },
      { k:"quiz", q:"Pourquoi vos pois chiches restent durs après 2 h de cuisson avec la tomate ?", o:["L’acide de la tomate ralentit leur ramollissement","La tomate les sale trop","Ils ont été trempés trop longtemps"], a:0, why:"L’acidité renforce les parois des cellules végétales. Cuisez d’abord, acidifiez ensuite." }
    ]},
    { title:"Équilibrer une vinaigrette", steps:[
      { k:"card", h:"Trois pour un", p:"Le point de départ classique : 3 volumes d’huile pour 1 volume de vinaigre, plus du sel. Avec un vinaigre doux ou du citron, on peut aller vers 2 pour 1." },
      { k:"card", h:"Goûtez sur une feuille", p:"Une vinaigrette goûtée à la cuillère paraît toujours trop acide. Trempez-y une feuille de salade : c’est ainsi qu’elle sera mangée.", tip:"<b>Liaison :</b> une cuillère à café de moutarde aide l’huile et le vinaigre à rester mélangés." },
      { k:"quiz", q:"Pour 9 cuillères d’huile, combien de vinaigre de vin ?", o:["1","3","9"], a:1, why:"Le rapport 3 pour 1 donne 3 cuillères de vinaigre." }
    ]}
  ]},
  { id:"gras", group:"Les quatre piliers", name:"Le gras", glyph:"G", color:"--gras", desc:"Le gras porte les arômes et donne la texture.", lessons:[
    { title:"Le gras porte les arômes", steps:[
      { k:"card", h:"Beaucoup d’arômes se dissolvent dans le gras", p:"Les composés aromatiques de l’ail, des épices ou des herbes se dissolvent mieux dans l’huile que dans l’eau. Une épice revenue dans l’huile chaude libère bien plus de goût qu’une épice jetée dans une sauce." },
      { k:"card", h:"Le gras arrondit", p:"Il adoucit l’acidité et le piquant et donne de la longueur en bouche. Un filet d’huile d’olive en finition change la perception d’une soupe.", tip:"<b>Finition :</b> une noix de beurre froid hors du feu lie et lustre une sauce." },
      { k:"quiz", q:"Pour tirer le maximum d’un cumin en grains, vous…", o:["le faites bouillir dans l’eau","le faites crépiter dans l’huile chaude","l’ajoutez cru au service"], a:1, why:"La chaleur et le gras libèrent et transportent les arômes du cumin." }
    ]},

const KEY = "sel-et-feu-v1";
const today = () => new Date().toISOString().slice(0, 10);
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.done) return s; } catch (e) {}
  return { done: {}, xp: 0, days: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();
let route = { tab: "learn" };
let lessonState = null;
let confirmReset = false;

const lid = (t, i) => t.id + ":" + i;
const doneIn = t => t.lessons.filter((_, i) => state.done[lid(t, i)]).length;
const totalLessons = TRACKS.reduce((n, t) => n + t.lessons.length, 0);
const doneCount = () => Object.keys(state.done).length;

function streak() {
  const set = new Set(state.days);
  let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (set.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function nextLesson() {
  for (const t of TRACKS) for (let i = 0; i < t.lessons.length; i++) if (!state.done[lid(t, i)]) return { t, i };
  return null;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const cvar = c => `style="--c: var(${c})"`;
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

const $main = document.getElementById("main"), $top = document.getElementById("top"), $tabs = document.getElementById("tabs");

function go(r) { route = r; confirmReset = false; render(); window.scrollTo(0, 0); }

function renderTop() {
  const inner = route.view && route.view !== "home";
  $top.innerHTML = `
    ${inner ? `<button class="back" data-act="back" aria-label="Retour">${I.back}</button>` : ""}
    <div class="brand">${inner ? "" : I.pan + "Sel &amp; Feu"}</div>
    <span class="chip" title="Série de jours" style="color: var(--chaleur)">${I.flame}<span style="color: var(--ink)">${streak()}</span></span>
    <span class="chip" title="Points d’expérience" style="color: var(--acide)">${I.star}<span style="color: var(--ink)">${state.xp} XP</span></span>`;
}

function renderTabs() {
  const tabs = [["learn", "Apprendre", I.book], ["fix", "Réparer", I.wrench], ["me", "Progrès", I.user]];
  $tabs.innerHTML = tabs.map(([id, label, ic]) =>
    `<button class="tab" data-tab="${id}" ${route.tab === id ? 'aria-current="page"' : ""}>${ic}<span>${label}</span></button>`).join("");
}

function viewLearn() {
  const n = nextLesson();
  const groups = [...new Set(TRACKS.map(t => t.group))];
  const trackCard = t => {
    const d = doneIn(t), pct = Math.round(d / t.lessons.length * 100);
    return `<button class="track" ${cvar(t.color)} data-track="${t.id}">
      <span class="glyph" aria-hidden="true">${t.glyph}</span>
      <span class="name">${t.name}</span>
      <span class="meta">${d} / ${plural(t.lessons.length, "leçon")}</span>
      <span class="bar"><i style="width:${pct}%"></i></span></button>`;
  };
  const trackRow = t => {
    const d = doneIn(t);
    return `<button class="row" ${cvar(t.color)} data-track="${t.id}">
      <span class="glyph" aria-hidden="true">${t.glyph}</span>
      <span class="txt"><span class="name">${t.name}</span><span class="meta">${d} / ${plural(t.lessons.length, "leçon")} · ${esc(t.desc)}</span></span>
      <span class="end">${d === t.lessons.length ? `<span style="color:var(--c)">${I.check}</span>` : I.chev}</span></button>`;
  };
  return `
    <section class="hello">
      <h1>${doneCount() ? "On reprend ?" : "Apprenez à cuisiner sans recette."}</h1>
      <p>Des leçons de 5 minutes sur le sel, l’acide, le gras et la chaleur, puis les cuisines du monde.</p>
    </section>
    ${n ? `<button class="next" data-lesson="${n.t.id}" data-i="${n.i}">
      <span class="eyebrow">Prochaine leçon · ${n.t.name}</span>
      <h2>${esc(n.t.lessons[n.i].title)}</h2>
      <span class="go"><span>${n.t.lessons[n.i].steps.length} étapes · environ 5 min</span>${I.chev}</span></button>`
      : `<div class="next"><span class="eyebrow">Bravo</span><h2>Toutes les leçons sont terminées.</h2></div>`}
    ${groups.map(g => {
      const ts = TRACKS.filter(t => t.group === g);
      return `<section class="section"><h3>${g}</h3>
        ${g === "Les quatre piliers" ? `<div class="pillars">${ts.map(trackCard).join("")}</div>` : `<div class="list">${ts.map(trackRow).join("")}</div>`}
      </section>`;
    }).join("")}`;
}

function viewTrack(t) {
  const d = doneIn(t);
  return `<div ${cvar(t.color)}>
    <section class="track-head">
      <span class="glyph" aria-hidden="true">${t.glyph}</span>
      <h1>${t.name}</h1>
      <p>${esc(t.desc)}</p>
      <span class="bar"><i style="width:${Math.round(d / t.lessons.length * 100)}%"></i></span>
    </section>
    <div class="list">
      ${t.lessons.map((l, i) => {
        const done = state.done[lid(t, i)];
        return `<button class="row lesson-row ${done ? "done" : ""}" data-lesson="${t.id}" data-i="${i}">
          <span class="num">${done ? I.check : i + 1}</span>
          <span class="txt"><span class="name">${esc(l.title)}</span><span class="meta">${done ? "Terminée · revoir" : l.steps.length + " étapes · 5 min"}</span></span>
          <span class="end">${I.chev}</span></button>`;
      }).join("")}
    </div></div>`;
}

function viewLesson() {
  const { t, i, step, picked, finished, gained } = lessonState;
  const l = t.lessons[i];
  if (finished) {
    const n = nextLesson();
    return `<div class="done-screen" ${cvar(t.color)}>
      <div class="medal">${I.check}</div>
      <h1>Leçon terminée</h1>
      <p>${esc(l.title)} · ${t.name}</p>
      <div class="xp">${gained ? "+" + gained + " XP" : "Déjà acquise"}</div>
      <div class="actions">
        ${n ? `<button class="cta" data-lesson="${n.t.id}" data-i="${n.i}">Leçon suivante : ${esc(n.t.lessons[n.i].title)}</button>` : ""}
        <button class="cta ghost" data-track="${t.id}">Retour à « ${t.name} »</button>
      </div></div>`;
  }
  const s = l.steps[step];
  const bars = l.steps.map((_, k) => `<i class="${k <= step ? "on" : ""}"></i>`).join("");
  let body, canNext = true;
  if (s.k === "card") {
    body = `<div class="card"><span class="kicker">${esc(l.title)}</span><h2>${s.h}</h2><p>${s.p}</p>${s.tip ? `<div class="tip">${s.tip}</div>` : ""}</div>`;
  } else {
    const answered = picked !== null;
    canNext = answered;
    body = `<div class="card"><span class="kicker">Question</span><h2>${s.q}</h2>
      <div class="opts" role="group">${s.o.map((o, k) => {
        let cls = "";
        if (answered && k === s.a) cls = "right"; else if (answered && k === picked) cls = "wrong";
        return `<button class="opt ${cls}" data-pick="${k}" ${answered ? "disabled" : ""}>${o}</button>`;
      }).join("")}</div>
      ${answered ? `<div class="feedback ${picked === s.a ? "ok" : "ko"}" role="status"><strong>${picked === s.a ? "Exact." : "Pas tout à fait."}</strong>${s.why}</div>` : ""}
    </div>`;
  }
  const last = step === l.steps.length - 1;
  return `<div class="lesson" ${cvar(t.color)}>
    <div class="steps" aria-label="Étape ${step + 1} sur ${l.steps.length}">${bars}</div>
    ${body}
    <button class="cta" data-act="next" ${canNext ? "" : "disabled"}>${!canNext ? "Choisissez une réponse" : last ? "Terminer la leçon" : "Continuer"}</button>
  </div>`;
}

function viewFixList() {
  return `<section class="fix-intro">
      <h1>Réparer un plat</h1>
      <p>Choisissez le problème. Vous obtenez la correction, la raison, et comment l’éviter.</p>
    </section>
    <div class="problems">${FIXES.map(f => `<button class="problem" ${cvar(f.color)} data-fix="${f.id}">
      <span class="tag">${f.tag}</span><span class="name">${f.name}</span></button>`).join("")}</div>`;
}

function viewFix(f) {
  return `<div class="fix" ${cvar(f.color)}>
    <h1>${f.name}</h1>
    <p class="symptom">${f.symptom}</p>
    <div class="block primary"><h3>Ce qu’il faut faire</h3><ol>${f.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>
    <div class="block"><h3>Pourquoi ça marche</h3><p>${f.why}</p></div>
    <div class="block"><h3>La prochaine fois</h3><p>${f.next}</p></div>
    <button class="cta ghost" data-act="back">Voir les autres problèmes</button>
  </div>`;
}

function viewMe() {
  const set = new Set(state.days);
  const names = ["L", "M", "M", "J", "V", "S", "D"];
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const week = names.map((nm, k) => {
    const d = new Date(now); d.setDate(now.getDate() - dow + k);
    return `<div class="day ${set.has(d.toISOString().slice(0, 10)) ? "on" : ""}"><i></i>${nm}</div>`;
  }).join("");
  return `<section class="fix-intro"><h1>Vos progrès</h1><p>Une leçon par jour suffit pour garder votre série.</p></section>
    <div class="stats">
      <div class="stat"><b>${doneCount()}</b><span>sur ${totalLessons} leçons</span></div>
      <div class="stat"><b>${streak()}</b><span>${streak() > 1 ? "jours de suite" : "jour de suite"}</span></div>
      <div class="stat"><b>${state.xp}</b><span>XP</span></div>
    </div>
    <section class="section"><h3>Cette semaine</h3><div class="week">${week}</div></section>
    <section class="section"><h3>Par piste</h3><div class="list">${TRACKS.map(t => {
      const d = doneIn(t);
      return `<button class="row" ${cvar(t.color)} data-track="${t.id}"><span class="glyph" aria-hidden="true">${t.glyph}</span>
        <span class="txt"><span class="name">${t.name}</span><span class="bar"><i style="width:${Math.round(d / t.lessons.length * 100)}%"></i></span></span>
        <span class="meta" style="font-variant-numeric: tabular-nums">${d}/${t.lessons.length}</span></button>`;
    }).join("")}</div></section>
    <section class="section">
      ${confirmReset ? `<div class="confirm"><p>Effacer toute votre progression ? Cette action est définitive.</p>
        <div class="two"><button class="cta ghost" data-act="cancel-reset">Annuler</button><button class="cta danger" data-act="do-reset">Effacer</button></div></div>`
      : `<button class="cta ghost" data-act="reset">Réinitialiser la progression</button>`}
      <p class="note">Votre progression est enregistrée dans ce navigateur uniquement. Sans compte, sans publicité.</p>
    </section>`;
}

function render() {
  renderTop(); renderTabs();
  let html;
  const v = route.view || "home";
  if (v === "track") html = viewTrack(TRACKS.find(t => t.id === route.id));
  else if (v === "lesson") html = viewLesson();
  else if (v === "fix") html = viewFix(FIXES.find(f => f.id === route.id));
  else if (route.tab === "fix") html = viewFixList();
  else if (route.tab === "me") html = viewMe();
  else html = viewLearn();
  $main.innerHTML = `<div class="view">${html}</div>`;
}

function startLesson(tid, i) {
  const t = TRACKS.find(x => x.id === tid);
  lessonState = { t, i: +i, step: 0, picked: null, finished: false, gained: 0 };
  go({ tab: "learn", view: "lesson", from: route });
}

function finishLesson() {
  const { t, i } = lessonState;
  const id = lid(t, i);
  if (!state.done[id]) { state.done[id] = today(); lessonState.gained = 10; state.xp += 10; }
  if (!state.days.includes(today())) state.days.push(today());
  save();
  lessonState.finished = true;
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab) return go({ tab: d.tab });
  if (d.track) return go({ tab: route.tab === "me" ? "me" : "learn", view: "track", id: d.track });
  if (d.lesson) return startLesson(d.lesson, d.i);
  if (d.fix) return go({ tab: "fix", view: "fix", id: d.fix });
  if (d.pick !== undefined) { lessonState.picked = +d.pick; return render(); }
  switch (d.act) {
    case "back":
      if (route.view === "lesson") return go({ tab: "learn", view: "track", id: lessonState.t.id });
      return go({ tab: route.tab });
    case "next": {
      const l = lessonState.t.lessons[lessonState.i];
      if (lessonState.step === l.steps.length - 1) return finishLesson();
      lessonState.step++; lessonState.picked = null; render(); window.scrollTo(0, 0); return;
    }
    case "reset": confirmReset = true; return render();
    case "cancel-reset": confirmReset = false; return render();
    case "do-reset": state = { done: {}, xp: 0, days: [] }; save(); confirmReset = false; return render();
  }
});

render();
</script>
